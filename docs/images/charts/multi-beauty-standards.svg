<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="centerGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.3" />
    </radialGradient>
    <linearGradient id="diversityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.7" />
      <stop offset="25%" style="stop-color:#8b5cf6;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.7" />
      <stop offset="75%" style="stop-color:#10b981;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fefefe"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">美丽的多元定义图谱</text>
  
  <!-- Central Core: 个人美学 -->
  <g transform="translate(350, 250)">
    <circle cx="50" cy="50" r="60" fill="url(#centerGradient)" stroke="#f59e0b" stroke-width="3"/>
    <text x="50" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400e">个人美学</text>
    <text x="50" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Personal</text>
    <text x="50" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Aesthetics</text>
  </g>
  
  <!-- Cultural Beauty Standards -->
  <g transform="translate(100, 100)">
    <circle cx="40" cy="40" r="35" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#be185d">🏮</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#be185d">东方美学</text>
    <rect x="-10" y="90" width="100" height="60" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="40" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">含蓄内敛</text>
    <text x="40" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">和谐统一</text>
    <text x="40" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">意境深远</text>
  </g>
  
  <g transform="translate(600, 100)">
    <circle cx="40" cy="40" r="35" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1d4ed8">🗽</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1d4ed8">西方美学</text>
    <rect x="-10" y="90" width="100" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="40" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">张扬个性</text>
    <text x="40" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">精确定义</text>
    <text x="40" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">创新突破</text>
  </g>
  
  <!-- Age-based Beauty -->
  <g transform="translate(100, 400)">
    <circle cx="40" cy="40" r="35" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#15803d">🌱</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#15803d">年龄美学</text>
    <rect x="-10" y="90" width="100" height="60" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
    <text x="40" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">青春活力</text>
    <text x="40" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">成熟韵味</text>
    <text x="40" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">优雅老去</text>
  </g>
  
  <g transform="translate(600, 400)">
    <circle cx="40" cy="40" r="35" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7c3aed">💎</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7c3aed">风格美学</text>
    <rect x="-10" y="90" width="100" height="60" rx="8" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="1"/>
    <text x="40" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">经典优雅</text>
    <text x="40" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">现代简约</text>
    <text x="40" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">个性前卫</text>
  </g>
  
  <!-- Inner Beauty -->
  <g transform="translate(350, 100)">
    <ellipse cx="50" cy="30" rx="45" ry="25" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="50" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">内在美</text>
    <text x="50" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">品格 • 智慧 • 情感</text>
  </g>
  
  <!-- Outer Beauty -->
  <g transform="translate(350, 450)">
    <ellipse cx="50" cy="30" rx="45" ry="25" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="50" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4338ca">外在美</text>
    <text x="50" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">形象 • 气质 • 表达</text>
  </g>
  
  <!-- Diversity Spectrum -->
  <g transform="translate(200, 250)">
    <rect x="0" y="0" width="200" height="30" rx="15" fill="url(#diversityGradient)" opacity="0.8"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">多元美学光谱</text>
    <text x="100" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">每个人都有独特的美丽表达</text>
  </g>
  
  <!-- Connection Lines -->
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" fill="none">
    <line x1="175" y1="175" x2="350" y2="280"/>
    <line x1="625" y1="175" x2="450" y2="280"/>
    <line x1="175" y1="425" x2="350" y2="320"/>
    <line x1="625" y1="425" x2="450" y2="320"/>
    <line x1="400" y1="130" x2="400" y2="250"/>
    <line x1="400" y1="350" x2="400" y2="450"/>
  </g>
  
  <!-- Beauty Dimensions -->
  <g transform="translate(50, 50)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">美丽维度：</text>
    <g transform="translate(0, 20)">
      <circle cx="5" cy="5" r="3" fill="#ec4899"/>
      <text x="15" y="10" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">文化美学</text>
    </g>
    <g transform="translate(0, 35)">
      <circle cx="5" cy="5" r="3" fill="#22c55e"/>
      <text x="15" y="10" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">时代美学</text>
    </g>
    <g transform="translate(0, 50)">
      <circle cx="5" cy="5" r="3" fill="#8b5cf6"/>
      <text x="15" y="10" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">个性美学</text>
    </g>
  </g>
  
  <!-- Beauty Values -->
  <g transform="translate(550, 50)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">美学价值观：</text>
    <rect x="0" y="10" width="200" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">包容性原则</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="9" fill="#64748b">• 接纳差异，尊重个性</text>
    <text x="15" y="58" font-family="Arial, sans-serif" font-size="9" fill="#64748b">• 保护文化多样性</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569">个性化原则</text>
    <text x="15" y="88" font-family="Arial, sans-serif" font-size="9" fill="#64748b">• 自我定义，动态发展</text>
  </g>
  
  <!-- Historical Evolution -->
  <g transform="translate(50, 520)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">美学演变历程：</text>
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="60" height="20" rx="10" fill="#fef3c7"/>
      <text x="30" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#92400e">古典</text>
    </g>
    <g transform="translate(70, 20)">
      <rect x="0" y="0" width="60" height="20" rx="10" fill="#fed7aa"/>
      <text x="30" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#c2410c">现代</text>
    </g>
    <g transform="translate(140, 20)">
      <rect x="0" y="0" width="60" height="20" rx="10" fill="#fecaca"/>
      <text x="30" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dc2626">后现代</text>
    </g>
    <g transform="translate(210, 20)">
      <rect x="0" y="0" width="60" height="20" rx="10" fill="#dcfce7"/>
      <text x="30" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#16a34a">多元化</text>
    </g>
  </g>
  
  <!-- Future Vision -->
  <g transform="translate(400, 520)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">未来美学愿景：</text>
    <rect x="0" y="10" width="300" height="50" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#0284c7" font-weight="bold">包容 • 可持续 • 个性化 • 科技融合</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="9" fill="#64748b">每个人都能找到属于自己的美丽表达方式</text>
    <text x="10" y="58" font-family="Arial, sans-serif" font-size="9" fill="#64748b">美丽不再是标准化的模板，而是多元化的绽放</text>
  </g>
  
  <!-- Decorative Elements -->
  <g opacity="0.3">
    <circle cx="150" cy="300" r="2" fill="#ec4899"/>
    <circle cx="650" cy="300" r="2" fill="#3b82f6"/>
    <circle cx="400" cy="200" r="2" fill="#22c55e"/>
    <circle cx="400" cy="400" r="2" fill="#8b5cf6"/>
    <path d="M150 300 Q400 250 650 300" stroke="#94a3b8" stroke-width="1" fill="none"/>
    <path d="M400 200 Q300 300 400 400" stroke="#94a3b8" stroke-width="1" fill="none"/>
  </g>
</svg>