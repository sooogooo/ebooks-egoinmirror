<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="processGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fed7aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecaca;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">医美消费决策流程图</text>
  
  <!-- Process Flow -->
  <!-- Step 1: 触发 -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="120" height="80" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">触发阶段</text>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">• 外貌焦虑</text>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">• 社会比较</text>
    <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">• 年龄恐惧</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M170 140 L210 140" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- Step 2: 信息收集 -->
  <g transform="translate(220, 100)">
    <rect x="0" y="0" width="120" height="80" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">信息收集</text>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">• 网络搜索</text>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">• 朋友推荐</text>
    <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">• 广告影响</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M340 140 L380 140" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- Step 3: 咨询评估 -->
  <g transform="translate(390, 100)">
    <rect x="0" y="0" width="120" height="80" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#15803d">咨询评估</text>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">• 专业咨询</text>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">• 风险评估</text>
    <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">• 方案选择</text>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M510 140 L550 140" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- Step 4: 决策 -->
  <g transform="translate(560, 100)">
    <rect x="0" y="0" width="120" height="80" rx="12" fill="#fce7f3" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#be185d">最终决策</text>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">• 理性分析</text>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">• 情感驱动</text>
    <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">• 冲动消费</text>
  </g>
  
  <!-- Decision Diamond -->
  <g transform="translate(350, 250)">
    <polygon points="50,0 100,25 50,50 0,25" fill="#fed7aa" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
    <text x="50" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9a3412">决策点</text>
  </g>
  
  <!-- Yes Path -->
  <g transform="translate(500, 250)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="50" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#15803d">执行</text>
    <text x="50" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">进行医美</text>
  </g>
  
  <!-- No Path -->
  <g transform="translate(200, 250)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <text x="50" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">放弃</text>
    <text x="50" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">暂不进行</text>
  </g>
  
  <!-- Post-Decision -->
  <g transform="translate(500, 350)">
    <rect x="0" y="0" width="100" height="80" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4338ca">术后体验</text>
    <text x="50" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 恢复期</text>
    <text x="50" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 效果评估</text>
    <text x="50" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 满意度</text>
  </g>
  
  <!-- Feedback Loop -->
  <path d="M500 390 Q300 450 100 390 Q50 350 50 300 Q50 250 100 200" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Influence Factors -->
  <g transform="translate(50, 450)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">影响因素：</text>
    
    <!-- Internal Factors -->
    <rect x="0" y="20" width="150" height="100" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <text x="75" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">内在因素</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 人格特质</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 自我认知</text>
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 价值观念</text>
    <text x="10" y="105" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 经济能力</text>
  </g>
  
  <!-- External Factors -->
  <g transform="translate(220, 470)">
    <rect x="0" y="0" width="150" height="100" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <text x="75" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">外在因素</text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 社会文化</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 媒体影响</text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 同伴压力</text>
    <text x="10" y="85" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 营销策略</text>
  </g>
  
  <!-- Risk Factors -->
  <g transform="translate(400, 470)">
    <rect x="0" y="0" width="150" height="100" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="75" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">风险因素</text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 医疗风险</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 心理风险</text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 经济风险</text>
    <text x="10" y="85" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 社会风险</text>
  </g>
  
  <!-- Arrow Marker Definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Decision Flow Arrows -->
  <path d="M400 275 L450 275" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M350 275 L300 275" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M550 310 L550 350" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- Labels -->
  <text x="475" y="270" font-family="Arial, sans-serif" font-size="10" fill="#15803d">是</text>
  <text x="325" y="270" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">否</text>
  
  <!-- Connection from decision to diamond -->
  <path d="M620 180 Q620 220 400 250" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
</svg>