<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="timelineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#fed7aa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fecaca;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#ddd6fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fefefe"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">术后心理历程时间线</text>
  
  <!-- Timeline Base -->
  <line x1="80" y1="100" x2="720" y2="100" stroke="url(#timelineGradient)" stroke-width="8"/>
  
  <!-- Time Markers -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    <text x="80" y="130" text-anchor="middle">术前</text>
    <text x="200" y="130" text-anchor="middle">术后1天</text>
    <text x="320" y="130" text-anchor="middle">1周</text>
    <text x="440" y="130" text-anchor="middle">1个月</text>
    <text x="560" y="130" text-anchor="middle">3个月</text>
    <text x="680" y="130" text-anchor="middle">6个月+</text>
  </g>
  
  <!-- Phase 1: 术前期待 -->
  <g transform="translate(50, 150)">
    <circle cx="30" cy="30" r="25" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="30" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#d97706">✨</text>
    <text x="30" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#92400e">期待</text>
    <rect x="-20" y="70" width="100" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="30" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">术前期待</text>
    <text x="30" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 完美幻想</text>
    <text x="30" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 兴奋紧张</text>
    <text x="30" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 高期望值</text>
  </g>
  
  <!-- Phase 2: 术后震惊 -->
  <g transform="translate(170, 150)">
    <circle cx="30" cy="30" r="25" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <text x="30" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#dc2626">😱</text>
    <text x="30" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#991b1b">震惊</text>
    <rect x="-20" y="70" width="100" height="80" rx="8" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
    <text x="30" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">术后震惊</text>
    <text x="30" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 形象陌生</text>
    <text x="30" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 肿胀疼痛</text>
    <text x="30" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 后悔恐慌</text>
  </g>
  
  <!-- Phase 3: 焦虑期 -->
  <g transform="translate(290, 150)">
    <circle cx="30" cy="30" r="25" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <text x="30" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#c2410c">😰</text>
    <text x="30" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#9a3412">焦虑</text>
    <rect x="-20" y="70" width="100" height="80" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
    <text x="30" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2410c">焦虑期</text>
    <text x="30" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 频繁照镜</text>
    <text x="30" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 过度关注</text>
    <text x="30" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 社交回避</text>
  </g>
  
  <!-- Phase 4: 适应期 -->
  <g transform="translate(410, 150)">
    <circle cx="30" cy="30" r="25" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="30" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7c3aed">🤔</text>
    <text x="30" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#6d28d9">适应</text>
    <rect x="-20" y="70" width="100" height="80" rx="8" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="1"/>
    <text x="30" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7c3aed">适应期</text>
    <text x="30" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 逐渐接受</text>
    <text x="30" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 心理调整</text>
    <text x="30" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 重建认同</text>
  </g>
  
  <!-- Phase 5: 稳定期 -->
  <g transform="translate(530, 150)">
    <circle cx="30" cy="30" r="25" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="30" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#16a34a">😊</text>
    <text x="30" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#15803d">稳定</text>
    <rect x="-20" y="70" width="100" height="80" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
    <text x="30" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">稳定期</text>
    <text x="30" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 满意接受</text>
    <text x="30" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 自信重建</text>
    <text x="30" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 正常生活</text>
  </g>
  
  <!-- Phase 6: 长期评估 -->
  <g transform="translate(650, 150)">
    <circle cx="30" cy="30" r="25" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="30" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4f46e5">🎯</text>
    <text x="30" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#4338ca">评估</text>
    <rect x="-20" y="70" width="100" height="80" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
    <text x="30" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4f46e5">长期评估</text>
    <text x="30" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 效果评价</text>
    <text x="30" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 经验总结</text>
    <text x="30" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 未来规划</text>
  </g>
  
  <!-- Emotional Curve -->
  <g>
    <path d="M80 350 Q150 300 200 380 Q250 420 320 400 Q380 380 440 360 Q500 340 560 330 Q620 325 680 320" 
          stroke="#8b5cf6" stroke-width="3" fill="none" filter="url(#glow)"/>
    <text x="400" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">情绪波动曲线</text>
  </g>
  
  <!-- Satisfaction Levels -->
  <g transform="translate(50, 450)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">满意度分布：</text>
    
    <!-- High Satisfaction -->
    <rect x="0" y="20" width="200" height="30" rx="15" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="12" fill="#15803d">高满意度 (35%)</text>
    <rect x="10" y="25" width="70" height="20" rx="10" fill="#22c55e"/>
    
    <!-- Medium Satisfaction -->
    <rect x="0" y="60" width="200" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="10" y="80" font-family="Arial, sans-serif" font-size="12" fill="#92400e">中等满意度 (45%)</text>
    <rect x="10" y="65" width="90" height="20" rx="10" fill="#f59e0b"/>
    
    <!-- Low Satisfaction -->
    <rect x="0" y="100" width="200" height="30" rx="15" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
    <text x="10" y="120" font-family="Arial, sans-serif" font-size="12" fill="#dc2626">低满意度 (20%)</text>
    <rect x="10" y="105" width="40" height="20" rx="10" fill="#ef4444"/>
  </g>
  
  <!-- Risk Factors -->
  <g transform="translate(300, 450)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">心理风险因素：</text>
    
    <rect x="0" y="20" width="250" height="110" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">需要关注的信号：</text>
    <text x="15" y="60" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 持续情绪低落超过2周</text>
    <text x="15" y="75" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 强迫性检查行为</text>
    <text x="15" y="90" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 严重社交回避</text>
    <text x="15" y="105" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 自我伤害想法</text>
    <text x="15" y="120" font-family="Arial, sans-serif" font-size="10" fill="#dc2626" font-weight="bold">出现以上情况请及时寻求专业帮助</text>
  </g>
  
  <!-- Support System -->
  <g transform="translate(580, 450)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">支持系统：</text>
    
    <rect x="0" y="20" width="180" height="110" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">重要支持来源：</text>
    <text x="15" y="60" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 家人朋友理解</text>
    <text x="15" y="75" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 医疗团队关怀</text>
    <text x="15" y="90" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 同伴经验分享</text>
    <text x="15" y="105" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">• 专业心理咨询</text>
    <text x="15" y="120" font-family="Arial, sans-serif" font-size="10" fill="#0284c7" font-weight="bold">建立完善支持网络很重要</text>
  </g>
  
  <!-- Connection Lines -->
  <line x1="80" y1="95" x2="80" y2="180" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="200" y1="95" x2="200" y2="180" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="320" y1="95" x2="320" y2="180" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="440" y1="95" x2="440" y2="180" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="560" y1="95" x2="560" y2="180" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="680" y1="95" x2="680" y2="180" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
</svg>