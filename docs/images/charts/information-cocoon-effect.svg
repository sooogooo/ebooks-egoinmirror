<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cocoonGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.3" />
      <stop offset="70%" style="stop-color:#f59e0b;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.9" />
    </radialGradient>
    <linearGradient id="algorithmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fefefe"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">信息茧房效应：算法如何塑造认知</text>
  
  <!-- Information Cocoon -->
  <g transform="translate(300, 200)">
    <circle cx="100" cy="100" r="120" fill="url(#cocoonGradient)" stroke="#d97706" stroke-width="3" filter="url(#glow)"/>
    <circle cx="100" cy="100" r="80" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5"/>
    <circle cx="100" cy="100" r="40" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- User in center -->
    <circle cx="100" cy="100" r="25" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="100" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6d28d9">用户</text>
    <text x="100" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">User</text>
  </g>
  
  <!-- Algorithm Engine -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="120" height="80" rx="12" fill="url(#algorithmGradient)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">算法引擎</text>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e7ff">数据收集</text>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e7ff">个性化推荐</text>
    <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e7ff">反馈优化</text>
  </g>
  
  <!-- Information Types Inside Cocoon -->
  <g transform="translate(320, 160)">
    <ellipse cx="30" cy="30" rx="25" ry="20" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
    <text x="30" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#15803d">成功案例</text>
    <text x="30" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e293b">Success</text>
  </g>
  
  <g transform="translate(420, 180)">
    <ellipse cx="30" cy="30" rx="25" ry="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="30" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#92400e">美化内容</text>
    <text x="30" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e293b">Enhanced</text>
  </g>
  
  <g transform="translate(380, 260)">
    <ellipse cx="30" cy="30" rx="25" ry="20" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="30" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#be185d">相似偏好</text>
    <text x="30" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e293b">Similar</text>
  </g>
  
  <g transform="translate(320, 280)">
    <ellipse cx="30" cy="30" rx="25" ry="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="30" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8">热门推荐</text>
    <text x="30" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e293b">Trending</text>
  </g>
  
  <!-- Excluded Information Outside -->
  <g transform="translate(100, 350)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" opacity="0.7"/>
    <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">被过滤信息</text>
    <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">• 失败案例</text>
    <text x="50" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">• 风险警告</text>
  </g>
  
  <g transform="translate(550, 350)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" opacity="0.7"/>
    <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">反对声音</text>
    <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">• 专业质疑</text>
    <text x="50" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">• 理性分析</text>
  </g>
  
  <g transform="translate(100, 450)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" opacity="0.7"/>
    <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">多元观点</text>
    <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">• 不同文化</text>
    <text x="50" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">• 替代方案</text>
  </g>
  
  <g transform="translate(550, 450)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" opacity="0.7"/>
    <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">客观数据</text>
    <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">• 统计信息</text>
    <text x="50" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">• 科学研究</text>
  </g>
  
  <!-- Algorithm Process Flow -->
  <g transform="translate(600, 100)">
    <text x="75" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">算法运作机制</text>
    <rect x="0" y="10" width="150" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">1. 数据收集</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="9" fill="#64748b">• 搜索历史</text>
    <text x="15" y="58" font-family="Arial, sans-serif" font-size="9" fill="#64748b">• 浏览行为</text>
    
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">2. 模式识别</text>
    <text x="15" y="90" font-family="Arial, sans-serif" font-size="9" fill="#64748b">• 兴趣标签</text>
    <text x="15" y="103" font-family="Arial, sans-serif" font-size="9" fill="#64748b">• 相似用户</text>
    
    <text x="10" y="120" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">3. 内容推荐</text>
  </g>
  
  <!-- Feedback Loop -->
  <g stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#blueArrow)">
    <path d="M170 90 Q250 150 300 200"/>
    <path d="M420 300 Q500 350 600 200"/>
  </g>
  
  <!-- Blue Arrow Marker -->
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>
  
  <!-- Cocoon Effects -->
  <g transform="translate(50, 250)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">茧房效应：</text>
    <g transform="translate(0, 20)">
      <circle cx="5" cy="5" r="3" fill="#ef4444"/>
      <text x="15" y="10" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">认知偏差加强</text>
    </g>
    <g transform="translate(0, 35)">
      <circle cx="5" cy="5" r="3" fill="#f59e0b"/>
      <text x="15" y="10" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">选择性暴露</text>
    </g>
    <g transform="translate(0, 50)">
      <circle cx="5" cy="5" r="3" fill="#ec4899"/>
      <text x="15" y="10" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">确认偏见</text>
    </g>
    <g transform="translate(0, 65)">
      <circle cx="5" cy="5" r="3" fill="#8b5cf6"/>
      <text x="15" y="10" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">信息单一化</text>
    </g>
  </g>
  
  <!-- Breaking the Cocoon -->
  <g transform="translate(600, 250)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#22c55e">破茧策略：</text>
    <rect x="0" y="10" width="150" height="100" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#15803d" font-weight="bold">✓ 多平台获取信息</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="10" fill="#15803d" font-weight="bold">✓ 主动搜索反面观点</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="10" fill="#15803d" font-weight="bold">✓ 清理算法历史</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="#15803d" font-weight="bold">✓ 关注权威机构</text>
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="10" fill="#15803d" font-weight="bold">✓ 线下专业咨询</text>
    <text x="10" y="105" font-family="Arial, sans-serif" font-size="10" fill="#15803d" font-weight="bold">✓ 延迟决策时间</text>
  </g>
  
  <!-- Warning Signs -->
  <g transform="translate(300, 450)">
    <text x="100" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">⚠️ 茧房警示信号</text>
    <rect x="0" y="10" width="200" height="80" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="9" fill="#dc2626">• 只看到支持自己观点的信息</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="9" fill="#dc2626">• 推荐内容高度相似</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="9" fill="#dc2626">• 对反对意见感到愤怒</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="9" fill="#dc2626">• 决策过于冲动和确定</text>
  </g>
  
  <!-- Data Flow Indicators -->
  <g opacity="0.6">
    <circle cx="200" cy="150" r="3" fill="#3b82f6"/>
    <circle cx="220" cy="170" r="3" fill="#3b82f6"/>
    <circle cx="240" cy="190" r="3" fill="#3b82f6"/>
    <circle cx="260" cy="210" r="3" fill="#3b82f6"/>
    <circle cx="280" cy="230" r="3" fill="#3b82f6"/>
    
    <circle cx="500" cy="250" r="3" fill="#3b82f6"/>
    <circle cx="520" cy="270" r="3" fill="#3b82f6"/>
    <circle cx="540" cy="290" r="3" fill="#3b82f6"/>
    <circle cx="560" cy="310" r="3" fill="#3b82f6"/>
    <circle cx="580" cy="330" r="3" fill="#3b82f6"/>
  </g>
</svg>