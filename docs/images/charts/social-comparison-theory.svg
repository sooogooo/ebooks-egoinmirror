<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="comparisonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fed7aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecaca;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="selfGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ddd6fe;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.6" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fefefe"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">社会比较理论：我们如何定位自己</text>
  
  <!-- Central Self -->
  <g transform="translate(350, 250)">
    <circle cx="50" cy="50" r="45" fill="url(#selfGradient)" stroke="#8b5cf6" stroke-width="3" filter="url(#shadow)"/>
    <text x="50" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6d28d9">自我</text>
    <text x="50" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Self</text>
  </g>
  
  <!-- Upward Comparison -->
  <g transform="translate(150, 100)">
    <rect x="0" y="0" width="140" height="100" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#15803d">向上比较</text>
    <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">与更优秀的人比较</text>
    <text x="70" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• 学习动机 ↗️</text>
    <text x="70" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• 自尊威胁 ↘️</text>
    <text x="70" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• 负面情绪 ↗️</text>
  </g>
  
  <!-- Downward Comparison -->
  <g transform="translate(510, 400)">
    <rect x="0" y="0" width="140" height="100" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">向下比较</text>
    <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">与不如自己的人比较</text>
    <text x="70" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• 自尊提升 ↗️</text>
    <text x="70" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• 优越感 ↗️</text>
    <text x="70" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• 自满风险 ↗️</text>
  </g>
  
  <!-- Lateral Comparison -->
  <g transform="translate(510, 100)">
    <rect x="0" y="0" width="140" height="100" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">横向比较</text>
    <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">与相似水平的人比较</text>
    <text x="70" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• 群体认同 ↗️</text>
    <text x="70" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• 规范理解 ↗️</text>
    <text x="70" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• 决策参考 ↗️</text>
  </g>
  
  <!-- Social Media Influence -->
  <g transform="translate(150, 400)">
    <rect x="0" y="0" width="140" height="100" rx="12" fill="#fce7f3" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#be185d">社交媒体影响</text>
    <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">算法推荐的比较对象</text>
    <text x="70" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• 滤镜美化 ↗️</text>
    <text x="70" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• 选择性展示 ↗️</text>
    <text x="70" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• 比较频率 ↗️</text>
  </g>
  
  <!-- Comparison Arrows -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)">
    <path d="M290 150 Q320 200 350 250"/>
    <path d="M510 150 Q480 200 450 250"/>
    <path d="M290 450 Q320 400 350 350"/>
    <path d="M510 450 Q480 400 450 350"/>
  </g>
  
  <!-- Arrow Marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Comparison Outcomes -->
  <g transform="translate(50, 250)">
    <ellipse cx="40" cy="40" rx="35" ry="30" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#15803d">积极结果</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">学习成长</text>
  </g>
  
  <g transform="translate(660, 250)">
    <ellipse cx="40" cy="40" rx="35" ry="30" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">消极结果</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">焦虑抑郁</text>
  </g>
  
  <!-- Comparison Process Flow -->
  <g transform="translate(300, 520)">
    <text x="100" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">比较过程循环</text>
    <rect x="0" y="10" width="200" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="100" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">1. 选择比较对象</text>
    <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">2. 进行比较评估</text>
    <text x="100" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">3. 产生情感反应</text>
  </g>
  
  <!-- Factors Influencing Comparison -->
  <g transform="translate(50, 50)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">影响比较的因素：</text>
    <g transform="translate(0, 20)">
      <circle cx="5" cy="5" r="3" fill="#ec4899"/>
      <text x="15" y="10" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">相似性程度</text>
    </g>
    <g transform="translate(0, 35)">
      <circle cx="5" cy="5" r="3" fill="#3b82f6"/>
      <text x="15" y="10" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">比较维度</text>
    </g>
    <g transform="translate(0, 50)">
      <circle cx="5" cy="5" r="3" fill="#22c55e"/>
      <text x="15" y="10" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">个人目标</text>
    </g>
    <g transform="translate(0, 65)">
      <circle cx="5" cy="5" r="3" fill="#f59e0b"/>
      <text x="15" y="10" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">情境因素</text>
    </g>
  </g>
  
  <!-- Healthy Comparison Tips -->
  <g transform="translate(550, 50)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">健康比较策略：</text>
    <rect x="0" y="10" width="200" height="80" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#0284c7" font-weight="bold">✓ 多维度思考</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="9" fill="#64748b">不只看外表，关注多个方面</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="10" fill="#0284c7" font-weight="bold">✓ 学习导向</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="9" fill="#64748b">从比较中学习，而非自我贬低</text>
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="10" fill="#0284c7" font-weight="bold">✓ 现实检验</text>
  </g>
  
  <!-- Warning Signs -->
  <g transform="translate(50, 520)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">⚠️ 不健康比较的信号：</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="9" fill="#64748b">• 频繁的负面情绪</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="9" fill="#64748b">• 回避社交活动</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="9" fill="#64748b">• 过度关注他人评价</text>
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="9" fill="#64748b">• 自我价值感下降</text>
  </g>
</svg>