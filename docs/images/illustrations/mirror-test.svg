<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mirrorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:0.6" />
    </linearGradient>
    <radialGradient id="childGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed7aa;stop-opacity:0.8" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#00000020"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#fefefe"/>
  
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">镜子测试：自我认知的觉醒</text>
  
  <!-- Mirror Frame -->
  <g transform="translate(200, 80)">
    <rect x="0" y="0" width="200" height="250" rx="15" fill="#8b5cf6" stroke="#6d28d9" stroke-width="3" filter="url(#softShadow)"/>
    <rect x="10" y="10" width="180" height="230" rx="10" fill="url(#mirrorGradient)"/>
  </g>
  
  <!-- Child (Real) -->
  <g transform="translate(80, 200)">
    <circle cx="40" cy="40" r="30" fill="url(#childGradient)" stroke="#f59e0b" stroke-width="2"/>
    <!-- Face features -->
    <circle cx="32" cy="35" r="3" fill="#1e293b"/>
    <circle cx="48" cy="35" r="3" fill="#1e293b"/>
    <path d="M35 45 Q40 50 45 45" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Red dot on forehead -->
    <circle cx="40" cy="25" r="4" fill="#ef4444"/>
    
    <!-- Body -->
    <rect x="25" y="70" width="30" height="40" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <!-- Arms -->
    <rect x="15" y="75" width="8" height="25" rx="4" fill="#fed7aa"/>
    <rect x="57" y="75" width="8" height="25" rx="4" fill="#fed7aa"/>
    <!-- Legs -->
    <rect x="30" y="110" width="8" height="30" rx="4" fill="#fed7aa"/>
    <rect x="42" y="110" width="8" height="30" rx="4" fill="#fed7aa"/>
    
    <text x="40" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">真实的孩子</text>
  </g>
  
  <!-- Child (Reflection) -->
  <g transform="translate(320, 200)">
    <circle cx="40" cy="40" r="30" fill="url(#childGradient)" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
    <!-- Face features (mirrored) -->
    <circle cx="48" cy="35" r="3" fill="#1e293b"/>
    <circle cx="32" cy="35" r="3" fill="#1e293b"/>
    <path d="M45 45 Q40 50 35 45" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Red dot on forehead (mirrored) -->
    <circle cx="40" cy="25" r="4" fill="#ef4444"/>
    
    <!-- Body (mirrored) -->
    <rect x="25" y="70" width="30" height="40" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" opacity="0.8"/>
    <!-- Arms (mirrored) -->
    <rect x="57" y="75" width="8" height="25" rx="4" fill="#fed7aa" opacity="0.8"/>
    <rect x="15" y="75" width="8" height="25" rx="4" fill="#fed7aa" opacity="0.8"/>
    <!-- Legs -->
    <rect x="42" y="110" width="8" height="30" rx="4" fill="#fed7aa" opacity="0.8"/>
    <rect x="30" y="110" width="8" height="30" rx="4" fill="#fed7aa" opacity="0.8"/>
    
    <text x="40" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">镜中的自己</text>
  </g>
  
  <!-- Action Arrow -->
  <g transform="translate(140, 220)">
    <path d="M0 0 L30 0" stroke="#ef4444" stroke-width="3" marker-end="url(#redArrow)" fill="none"/>
    <text x="15" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ef4444" font-weight="bold">触摸</text>
  </g>
  
  <!-- Red Arrow Marker -->
  <defs>
    <marker id="redArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>
  
  <!-- Age Progression -->
  <g transform="translate(50, 350)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">自我认知发展阶段：</text>
    
    <!-- 6-12 months -->
    <g transform="translate(0, 20)">
      <circle cx="10" cy="10" r="8" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
      <text x="10" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#dc2626">6-12月</text>
      <text x="30" y="15" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">对镜像感兴趣，但不知道是自己</text>
    </g>
    
    <!-- 12-18 months -->
    <g transform="translate(250, 20)">
      <circle cx="10" cy="10" r="8" fill="#fed7aa" stroke="#f59e0b" stroke-width="1"/>
      <text x="10" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#d97706">12-18月</text>
      <text x="30" y="15" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">开始注意到动作的同步性</text>
    </g>
    
    <!-- 18-24 months -->
    <g transform="translate(450, 20)">
      <circle cx="10" cy="10" r="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
      <text x="10" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#15803d">18-24月</text>
      <text x="30" y="15" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">通过镜子测试，认识到是自己</text>
    </g>
  </g>
  
  <!-- Test Description -->
  <g transform="translate(450, 100)">
    <rect x="0" y="0" width="140" height="120" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">镜子测试</text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">1. 在孩子不知情时</text>
    <text x="15" y="55" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">在额头涂红点</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">2. 让孩子照镜子</text>
    <text x="10" y="95" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">3. 观察孩子是否</text>
    <text x="15" y="110" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">触摸自己的红点</text>
  </g>
  
  <!-- Significance -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">重要意义</text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">标志着自我意识</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">的重要里程碑</text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">为后续美丽认知</text>
    <text x="10" y="85" font-family="Arial, sans-serif" font-size="9" fill="#1e293b">奠定基础</text>
  </g>
</svg>