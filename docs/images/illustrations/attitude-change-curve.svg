<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="curveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.8" />
      <stop offset="25%" style="stop-color:#f59e0b;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#eab308;stop-opacity:0.8" />
      <stop offset="75%" style="stop-color:#22c55e;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.8" />
    </linearGradient>
    <filter id="curveShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="500" fill="#fefefe"/>
  
  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">医美态度改变曲线</text>
  
  <!-- Axes -->
  <g stroke="#64748b" stroke-width="2">
    <!-- Y-axis -->
    <line x1="80" y1="80" x2="80" y2="400"/>
    <!-- X-axis -->
    <line x1="80" y1="400" x2="620" y2="400"/>
  </g>
  
  <!-- Y-axis labels -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="end">
    <text x="75" y="85">非常积极</text>
    <text x="75" y="145">比较积极</text>
    <text x="75" y="205">中性</text>
    <text x="75" y="265">比较消极</text>
    <text x="75" y="325">非常消极</text>
    <text x="75" y="385">极度消极</text>
  </g>
  
  <!-- X-axis labels -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
    <text x="120" y="420">初次接触</text>
    <text x="200" y="420">信息收集</text>
    <text x="280" y="420">深入了解</text>
    <text x="360" y="420">专业咨询</text>
    <text x="440" y="420">决策阶段</text>
    <text x="520" y="420">术后体验</text>
    <text x="600" y="420">长期评价</text>
  </g>
  
  <!-- Attitude Change Curve -->
  <g>
    <path d="M120 350 Q160 320 200 280 Q240 240 280 200 Q320 180 360 160 Q400 140 440 120 Q480 140 520 180 Q560 160 600 140" 
          stroke="url(#curveGradient)" stroke-width="4" fill="none" filter="url(#curveShadow)"/>
  </g>
  
  <!-- Data Points -->
  <g fill="#ffffff" stroke-width="2">
    <circle cx="120" cy="350" r="6" stroke="#ef4444"/>
    <circle cx="200" cy="280" r="6" stroke="#f59e0b"/>
    <circle cx="280" cy="200" r="6" stroke="#eab308"/>
    <circle cx="360" cy="160" r="6" stroke="#22c55e"/>
    <circle cx="440" cy="120" r="6" stroke="#3b82f6"/>
    <circle cx="520" cy="180" r="6" stroke="#8b5cf6"/>
    <circle cx="600" cy="140" r="6" stroke="#06b6d4"/>
  </g>
  
  <!-- Stage Descriptions -->
  <g transform="translate(80, 450)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">各阶段特征：</text>
    
    <!-- Stage 1 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="80" height="40" rx="4" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
      <text x="40" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#dc2626">初次接触</text>
      <text x="40" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e293b">抗拒、恐惧</text>
    </g>
    
    <!-- Stage 2 -->
    <g transform="translate(90, 20)">
      <rect x="0" y="0" width="80" height="40" rx="4" fill="#fed7aa" stroke="#f59e0b" stroke-width="1"/>
      <text x="40" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#d97706">信息收集</text>
      <text x="40" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e293b">好奇、谨慎</text>
    </g>
    
    <!-- Stage 3 -->
    <g transform="translate(180, 20)">
      <rect x="0" y="0" width="80" height="40" rx="4" fill="#fef3c7" stroke="#eab308" stroke-width="1"/>
      <text x="40" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#a16207">深入了解</text>
      <text x="40" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e293b">兴趣、考虑</text>
    </g>
    
    <!-- Stage 4 -->
    <g transform="translate(270, 20)">
      <rect x="0" y="0" width="80" height="40" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
      <text x="40" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#15803d">专业咨询</text>
      <text x="40" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e293b">信任、倾向</text>
    </g>
    
    <!-- Stage 5 -->
    <g transform="translate(360, 20)">
      <rect x="0" y="0" width="80" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
      <text x="40" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8">决策阶段</text>
      <text x="40" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e293b">积极、决定</text>
    </g>
    
    <!-- Stage 6 -->
    <g transform="translate(450, 20)">
      <rect x="0" y="0" width="80" height="40" rx="4" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="1"/>
      <text x="40" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#7c3aed">术后体验</text>
      <text x="40" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e293b">波动、适应</text>
    </g>
    
    <!-- Stage 7 -->
    <g transform="translate(540, 20)">
      <rect x="0" y="0" width="80" height="40" rx="4" fill="#cffafe" stroke="#06b6d4" stroke-width="1"/>
      <text x="40" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0891b2">长期评价</text>
      <text x="40" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e293b">稳定、理性</text>
    </g>
  </g>
  
  <!-- Influence Factors -->
  <g transform="translate(500, 80)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">影响因素：</text>
    <rect x="0" y="10" width="150" height="120" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#475569" font-weight="bold">正向影响</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="9" fill="#22c55e">• 成功案例展示</text>
    <text x="15" y="58" font-family="Arial, sans-serif" font-size="9" fill="#22c55e">• 专业权威背书</text>
    <text x="15" y="71" font-family="Arial, sans-serif" font-size="9" fill="#22c55e">• 同伴积极体验</text>
    
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="10" fill="#475569" font-weight="bold">负向影响</text>
    <text x="15" y="105" font-family="Arial, sans-serif" font-size="9" fill="#ef4444">• 风险信息曝光</text>
    <text x="15" y="118" font-family="Arial, sans-serif" font-size="9" fill="#ef4444">• 失败案例传播</text>
  </g>
  
  <!-- Critical Points -->
  <g transform="translate(500, 220)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">关键转折点：</text>
    <rect x="0" y="10" width="150" height="100" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="9" fill="#dc2626" font-weight="bold">1. 首次专业咨询</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="8" fill="#64748b">专业解答消除疑虑</text>
    
    <text x="10" y="65" font-family="Arial, sans-serif" font-size="9" fill="#dc2626" font-weight="bold">2. 术后初期体验</text>
    <text x="15" y="80" font-family="Arial, sans-serif" font-size="8" fill="#64748b">现实与期望的碰撞</text>
    
    <text x="10" y="100" font-family="Arial, sans-serif" font-size="9" fill="#dc2626" font-weight="bold">3. 效果稳定期</text>
  </g>
  
  <!-- Attitude Types -->
  <g transform="translate(500, 340)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">态度类型：</text>
    <rect x="0" y="10" width="150" height="80" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
    
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="9" fill="#0284c7">🔄 渐进型：缓慢接受</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="9" fill="#0284c7">⚡ 突变型：快速转变</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="9" fill="#0284c7">📊 波动型：反复变化</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="9" fill="#0284c7">🎯 稳定型：一致态度</text>
  </g>
  
  <!-- Grid Lines -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.5">
    <line x1="80" y1="140" x2="620" y2="140"/>
    <line x1="80" y1="200" x2="620" y2="200"/>
    <line x1="80" y1="260" x2="620" y2="260"/>
    <line x1="80" y1="320" x2="620" y2="320"/>
    
    <line x1="160" y1="80" x2="160" y2="400"/>
    <line x1="240" y1="80" x2="240" y2="400"/>
    <line x1="320" y1="80" x2="320" y2="400"/>
    <line x1="400" y1="80" x2="400" y2="400"/>
    <line x1="480" y1="80" x2="480" y2="400"/>
    <line x1="560" y1="80" x2="560" y2="400"/>
  </g>
  
  <!-- Neutral Line -->
  <line x1="80" y1="200" x2="620" y2="200" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="630" y="205" font-family="Arial, sans-serif" font-size="9" fill="#64748b">中性线</text>
</svg>